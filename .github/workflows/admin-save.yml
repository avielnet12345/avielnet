name: Admin Save Data
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON Data'
        required: false
      signature:
        description: 'HMAC Signature'
        required: false
      token:
        description: 'Auth Token'
        required: false

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Save Data to File
        run: |
          mkdir -p data
          echo '${{ github.event.inputs.payload }}' > data/zmanim.json
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "Admin Editor"
          git config --global user.email "admin@synagogue.com"
          git add data/zmanim.json
          git commit -m "Update zmanim via admin panel" || echo "No changes to commit"
          git push
