name: Admin Save Data
on:
  workflow_dispatch:
    inputs:
      payload:
        required: false
      data:
        required: false
      signature:
        required: false
      password:
        required: false
      token:
        required: false

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Save Data
        run: |
          # זיהוי איזה קלט הגיע (payload או data)
          DATA_CONTENT='${{ github.event.inputs.payload }}${{ github.event.inputs.data }}'
          
          # יצירת התיקייה ושמירה
          mkdir -p data
          echo "$DATA_CONTENT" > data/zmanim.json
          
          # עדכון הגיטהאב
          git config user.name "Admin Editor"
          git config user.email "admin@synagogue.com"
          git add data/zmanim.json
          git commit -m "Update zmanim via admin panel"
          git push
